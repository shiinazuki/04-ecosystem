# cargo-release 配置：https://github.com/crate-ci/cargo-release
#   发布流程：just release            （默认 patch）
#             just release minor
#             just release major
#
# 文件里的 {{version}} 等是 cargo-release 的占位符，已在 cargo-generate.toml
# 的 exclude 列表里，生成项目时不做变量替换。

# 只允许在这些分支上发版
allow-branch = ["main", "master"]

# tag 与提交信息的格式，与 cliff.toml 的 tag_pattern = "v[0-9].*" 对应
tag-name = "v{{version}}"
tag-message = "chore(release): {{crate_name}} v{{version}}"
pre-release-commit-message = "chore(release): v{{version}}"

# 发版前用 git-cliff 把 CHANGELOG 更新到新版本号，改动一并进入发版提交。
# 命令见 justfile 的 _changelog-for 配方。
pre-release-hook = ["just", "_changelog-for", "{{version}}"]

# 打完 tag 后自动 push 提交和 tag，CI 收到 tag 后创建 Release
push = true
push-remote = "origin"

# 本地发版时不执行 cargo publish。
# 发布到 crates.io 由 CI 那侧负责：GitHub 的 .github/workflows/release.yaml 里有
# crates-io job，用仓库变量 PUBLISH_TO_CRATES_IO=true 打开，走 Trusted Publishing（OIDC）。
publish = false

# 发版前做一次发布校验
verify = true

sign-commit = false
sign-tag = false
