name: audit

# 定时跑依赖安全公告检查：代码没动，风险也会变。
# push / PR 上的检查由 build.yaml 的 deny job 覆盖，这里补的是时间维度。
#
# 仓库连续 60 天没有提交时，GitHub 会自动停用定时 workflow，
# 需要在 Settings → Actions 里重新启用。
on:
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 模板仓库自身的 Cargo.toml 还是 liquid 占位符，cargo-deny 解析不了，
      # 所以先探测再决定是否跳过。判断依据与 build.yaml 的 detect job 一致。
      - name: Is this the template repo itself?
        id: probe
        run: |
          if grep -q '{%' Cargo.toml 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::这是模板仓库本身，跳过依赖审计（生成出来的项目里会正常执行）。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install cargo-deny
        if: steps.probe.outputs.skip == 'false'
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deny
      # `cargo deny check` 一条等价于 advisories + bans + licenses + sources
      - name: Check advisories / licenses / bans / sources
        if: steps.probe.outputs.skip == 'false'
        run: cargo deny check -A unmatched-bypass
