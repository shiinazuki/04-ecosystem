#:schema https://dystroy.org/bacon/.bacon.schema.json
# bacon：后台实时监控文件变化并重跑检查。启动：just dev
# 完整配置说明见 https://dystroy.org/bacon/config/
#
# 运行时按键切换任务：c=check-all  l=clippy-all  t=nextest  d=doc

default_job = "clippy-all"

env.CARGO_TERM_COLOR = "always"

[jobs.check-all]
command = ["cargo", "check", "--all-targets", "--all-features"]
need_stdout = false

# 参数与 CI 的 lint job 一致
[jobs.clippy-all]
command = ["cargo", "clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
need_stdout = false

[jobs.nextest]
command = [
  "cargo",
  "nextest",
  "run",
  "--all-targets",
  "--all-features",
  "--hide-progress-bar",
  "--failure-output",
  "final",
]
need_stdout = true
analyzer = "nextest"

[jobs.doc]
command = ["cargo", "doc", "--no-deps", "--all-features"]
need_stdout = false

# 生成文档并在浏览器里打开
[jobs.doc-open]
command = ["cargo", "doc", "--no-deps", "--all-features", "--open"]
need_stdout = false
on_success = "back" # 打开一次就退回上一个任务

# 直接运行程序，改代码自动重启；需要 bin target
[jobs.run]
command = ["cargo", "run", "--all-features"]
need_stdout = true
allow_warnings = true
background = false
# 在 bacon 面板里按 r 切到它

[keybindings]
c = "job:check-all"
l = "job:clippy-all"
t = "job:nextest"
d = "job:doc"
# r 切到 run 任务；需要 bin target
r = "job:run"
# 键位可以自由改，值写成 job:<任务名>
